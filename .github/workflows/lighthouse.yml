name: Lighthouse CI

# Non-blocking: runs Lighthouse (mobile) against the assembled _site/ and reports scores.
# Assertions are warnings only, so performance regressions never fail the PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and assemble _site
        run: npm run build:no-images && npm run site:assemble

      # staticDistDir, URLs and assertions live in the config file: the action has no
      # staticDistDir input (that is why every previous run failed).
      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Scores summary
        if: always()
        env:
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
          LINKS: ${{ steps.lhci.outputs.links }}
        run: |
          node -e '
            const manifest = JSON.parse(process.env.MANIFEST || "[]");
            const links = JSON.parse(process.env.LINKS || "{}");
            const pct = (v) => (v == null ? "-" : Math.round(v * 100));
            const rows = manifest.filter((r) => r.isRepresentativeRun).map((r) => {
              const s = r.summary || {};
              const path = new URL(r.url).pathname;
              const report = links[r.url] ? `[informe](${links[r.url]})` : "";
              return `| ${path} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s["best-practices"])} | ${pct(s.seo)} | ${report} |`;
            });
            const out = ["### Lighthouse (móvil)", "", "| Página | Performance | Accesibilidad | Best practices | SEO | |", "|---|---|---|---|---|---|", ...rows].join("\n");
            console.log(out);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
